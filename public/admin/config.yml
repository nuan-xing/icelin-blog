# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: nuan-xing/icelin-blog
  branch: main
  auth_methods: [token]

site_url: https://icelin-blog.pages.dev
display_url: https://icelin-blog.pages.dev
app_title: icelin 编辑室

logo:
  src: /favicon.svg
  show_in_header: true

# Sveltia requires a global media location. Collections can narrow this to a
# subdirectory when that makes uploads easier to organize.
media_folder: /public/images
public_folder: /images

# R2 is the single media source. GitHub should only store Markdown/frontmatter,
# not binary uploads.
media_libraries:
  default: false
  cloudflare_r2:
    # R2 Access Key ID from a bucket-scoped Object Read & Write token. The
    # secret is entered in Sveltia
    # when the R2 library is opened and must not be committed here.
    access_key_id: 79a39e7791fbcc5204789dc8e7a3eab6
    bucket: icelin-blog-media
    account_id: 0254e00c62f6f7f64408d1dddac1c150
    public_url: https://pub-2ab46ecc311a40e79c4d8c69c5f9da25.r2.dev

collections:
  - name: writing
    label: 随笔
    label_singular: 随笔
    folder: /src/content/writing
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    slug: "{{fields._slug}}"
    preview_path: "/writing/{{slug}}"

    media_folder: /public/images/writing
    public_folder: /images/writing

    fields:
      - name: title
        label: 标题
        widget: string

      - name: description
        label: 摘要
        widget: text

      - name: pubDate
        label: 发布日期
        widget: datetime
        type: date
        default: "{{now}}"

      - name: tags
        label: 标签
        widget: list
        required: false
        default: []

      - name: draft
        label: 草稿
        widget: boolean
        default: false

      - name: body
        label: 正文
        widget: richtext
        modes: [rich_text, raw]

  - name: photos
    label: 摄影
    label_singular: 摄影作品
    folder: /src/content/photos
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    slug: "{{fields._slug}}"

    media_folder: /public/images/photos
    public_folder: /images/photos

    fields:
      - name: title
        label: 标题
        widget: string

      - name: location
        label: 地点
        widget: string
        required: false

      - name: pubDate
        label: 拍摄日期
        widget: datetime
        type: date
        default: "{{now}}"

      - name: image
        label: 图片
        widget: image

      - name: alt
        label: 图片描述
        widget: string

      - name: caption
        label: 说明
        widget: text
        required: false

  - name: topics
    label: 专栏
    label_singular: 专栏
    description: 打开专栏后，可以直接添加、删除和排序图片，并编辑每张图片的标题、日期、描述和说明。
    folder: /src/content/topics
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    slug: "{{fields._slug}}"
    preview_path: "/photos/topics/{{slug}}"

    # Use the global library here so a column can reuse images from any folder.
    media_folder: /public/images
    public_folder: /images

    fields:
      - name: title
        label: 专栏名称
        widget: string

      - name: description
        label: 专栏简介
        widget: text

      - name: coverImage
        label: 封面图片
        widget: image

      - name: coverAlt
        label: 封面图片描述
        widget: string

      - name: eyebrow
        label: 小标题
        widget: string
        required: false
        hint: 例如 Photo Story 或 城市散步

      - name: photos
        label: 专栏图片
        label_singular: 图片
        widget: list
        required: false
        summary: "{{title}}"
        thumbnail: image
        collapsed: auto
        hint: 在这里添加、删除或拖动排序；每张图片都可以单独编辑标题、日期、描述和说明。
        fields:
          - name: title
            label: 图片标题
            widget: string

          - name: pubDate
            label: 拍摄日期
            widget: datetime
            type: date

          - name: image
            label: 图片
            widget: image

          - name: alt
            label: 图片描述
            widget: string

          - name: caption
            label: 说明
            widget: text
            required: false
