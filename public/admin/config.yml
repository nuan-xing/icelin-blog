# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: nuan-xing/icelin-blog
  branch: main
  auth_methods: [token]

site_url: https://icelin-blog.pages.dev
display_url: https://icelin-blog.pages.dev
app_title: icelin 编辑室

logo:
  src: /favicon.svg
  show_in_header: true

# Sveltia requires a global media location. Each collection below narrows this
# to its existing writing/photos subdirectory.
media_folder: /public/images
public_folder: /images

# Keep upload names URL-safe so image links work consistently on GitHub,
# Cloudflare Pages and mobile browsers.
media_libraries:
  default:
    config:
      slugify_filename: true

collections:
  - name: writing
    label: 随笔
    label_singular: 随笔
    folder: /src/content/writing
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    slug: "{{fields._slug}}"
    preview_path: "/writing/{{slug}}"

    media_folder: /public/images/writing
    public_folder: /images/writing

    fields:
      - name: title
        label: 标题
        widget: string

      - name: description
        label: 摘要
        widget: text

      - name: pubDate
        label: 发布日期
        widget: datetime
        type: date
        default: "{{now}}"

      - name: tags
        label: 标签
        widget: list
        required: false
        default: []

      - name: draft
        label: 草稿
        widget: boolean
        default: false

      - name: body
        label: 正文
        widget: richtext
        modes: [rich_text, raw]

  - name: photos
    label: 摄影
    label_singular: 摄影作品
    folder: /src/content/photos
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    slug: "{{fields._slug}}"

    media_folder: /public/images/photos
    public_folder: /images/photos

    fields:
      - name: title
        label: 标题
        widget: string

      - name: location
        label: 地点
        widget: string
        required: false

      - name: pubDate
        label: 拍摄日期
        widget: datetime
        type: date
        default: "{{now}}"

      - name: image
        label: 图片
        widget: image

      - name: alt
        label: 图片描述
        widget: string

      - name: caption
        label: 说明
        widget: text
        required: false

      - name: topic
        label: 所属专题
        widget: relation
        collection: topics
        value_field: "{{slug}}"
        display_fields: [title]
        search_fields: [title, description]
        required: false

  - name: topics
    label: 专题
    label_singular: 专题
    description: 先创建专题，再在摄影作品中选择所属专题，网站会自动生成专题页。
    folder: /src/content/topics
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    slug: "{{fields._slug}}"
    preview_path: "/photos/topics/{{slug}}"

    media_folder: /public/images/topics
    public_folder: /images/topics

    fields:
      - name: title
        label: 专题名称
        widget: string

      - name: description
        label: 专题简介
        widget: text

      - name: coverImage
        label: 封面图片
        widget: image

      - name: coverAlt
        label: 封面图片描述
        widget: string

      - name: eyebrow
        label: 小标题
        widget: string
        required: false
        hint: 例如 Photo Story 或 城市散步
